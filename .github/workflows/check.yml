name: Check performance source
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2 python3-tk
      - run: python -m pip install -r requirements-render.txt
      - run: python -m unittest discover -s tests -v
  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ios/PianoRemote.xcodeproj -scheme PianoRemote -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
